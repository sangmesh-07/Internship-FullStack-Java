<!DOCTYPE html>
<html>
<head>
    <title>Student Manager</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Student Manager</a>
    </div>
</nav>

<div class="container mt-4">

    <h3>Add Student</h3>

    <!-- Form -->
    <div class="card p-3">
        <input type="text" id="name" class="form-control mb-2" placeholder="Enter Name">
        <input type="number" id="age" class="form-control mb-2" placeholder="Enter Age">
        <button class="btn btn-primary" onclick="addStudent()">Add Student</button>
    </div>

    <!-- Table -->
    <h3 class="mt-4">Student List</h3>

    <table class="table table-bordered mt-2">
        <thead class="table-dark">
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

</div>

<script src="script.js"></script>
</body>
</html>
